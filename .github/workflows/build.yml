name: Build

on:
  push:
    branches: [vl_opencode_ds1]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false          # one OS failing doesn't cancel the others
      matrix:
        include:
          - os: ubuntu-latest
            name: rostra-linux-x86_64
          - os: windows-latest
            name: rostra-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The repo's rustfmt.toml uses nightly-only options, so format-check on nightly
      - name: Install nightly rustfmt
        if: matrix.os == 'ubuntu-latest'
        run: rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo +nightly fmt --all -- --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --release

      - name: Test
        run: cargo test --workspace

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            target/release/rostra
            target/release/rostra.exe
            target/release/rostra-*
          if-no-files-found: warn
