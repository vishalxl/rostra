name: "Release packages"

on:
  push:
    branches: [ "main", "master", "devel", "releases/v*", "vl_opencode_ds1" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master", "devel", "releases/v*" ]
  merge_group:
    branches: [ "main", "master", "devel", "releases/v*" ]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dpc/nix-installer-action@dpc/jj-vqymqvyntouw
      - uses: cachix/cachix-action@v15
        with:
          name: rostra
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true

      - name: Check `nix flake show`
        run: nix flake show .#



  pkg:
    name: "Build packages"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # needed to create GitHub Releases on tag pushes
    steps:
      - uses: actions/checkout@v4
      - uses: dpc/nix-installer-action@dpc/jj-vqymqvyntouw
      - uses: cachix/cachix-action@v15
        with:
          name: rostra
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true


      - name: Set BUILD_ID to tag or commit hash
        run: |
          if [[ $GITHUB_REF_TYPE == "tag" ]]; then
            echo "BUILD_ID=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          else
            echo "BUILD_ID=${GITHUB_SHA}" >> $GITHUB_ENV
          fi

      - name: Build rostra
        env:
          # seems like cachix needs this explicitly set in the env
          CACHIX_AUTH_TOKEN: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        run: |
          mkdir -p bins
          nix build -L .#rostra && sha256sum "./result/bin/rostra"

          closure_size=$(nix path-info -rS --json .#rostra | jq '. | to_entries[] | select(.value.ultimate == true) | .value.narSize')
          >&2 echo "rostra's Nix closure size: $closure_size"

          if [ 200000000 -lt $closure_size ]; then
            >&2 echo "rostra's Nix closure size seems too big: $closure_size"
            exit 1
          fi

      - name: Bundle single-file binary
        continue-on-error: true   # arx bundler is currently broken in the pinned nixpkgs
        run: |
          nix bundle --bundler .# ".#rostra" -o "bins/rostra-$BUILD_ID" && sha256sum "bins/rostra-$BUILD_ID"

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: "rostra-linux-x86_64-nix"
          path: "bins/**"
          if-no-files-found: warn

      - name: Release Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "bins/**"
          prerelease: ${{ contains(github.ref, 'rc') }}
          body: ${{ contains(github.ref, 'rc') && env.PRERELEASE_MESSAGE || '' }}

      - name: Build DEB package
        run: |
          nix bundle -L --bundler .#toDEB --accept-flake-config -o debs/rostra .#rostra
          # workaround: https://github.com/actions/upload-artifact/issues/92
          cp -a debs/rostra/*.deb debs/

      - name: Build RPM package
        run: |
          nix bundle -L --bundler .#toRPM --accept-flake-config -o rpms/rostra .#rostra
          # workaround: https://github.com/actions/upload-artifact/issues/92
          cp -a rpms/rostra/*.rpm rpms/

      - name: Upload DEB packages
        uses: actions/upload-artifact@v4
        with:
          name: "rostra-deb-bundle"
          path: "debs/**.deb"

      - name: Release DEB packages
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "debs/**.deb"
          prerelease: ${{ contains(github.ref, 'rc') }}
          body: ${{ contains(github.ref, 'rc') && env.PRERELEASE_MESSAGE || '' }}

      - name: Upload RPM packages
        uses: actions/upload-artifact@v4
        with:
          name: "rostra-rpm-bundle"
          path: "rpms/**.rpm"

      - name: Release RPM packages
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "rpms/**.rpm"
          prerelease: ${{ contains(github.ref, 'rc') }}
          body: ${{ contains(github.ref, 'rc') && env.PRERELEASE_MESSAGE || '' }}


  windows:
    name: "Build Windows package"
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write   # needed to create GitHub Releases on tag pushes
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set BUILD_ID to tag or commit hash
        run: |
          if [[ $GITHUB_REF_TYPE == "tag" ]]; then
            echo "BUILD_ID=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          else
            echo "BUILD_ID=${GITHUB_SHA}" >> $GITHUB_ENV
          fi

      - name: Build rostra (release)
        run: cargo build --release --bin rostra

      - name: Assemble package (exe + web UI assets)
        run: |
          mkdir -p dist
          cp target/release/rostra.exe dist/
          # The web UI assets are generated by a build script into cargo's OUT_DIR
          assets_dir=$(find target/release/build -type d -path '*rostra-web-ui*/out/assets' | head -n1)
          echo "assets dir: ${assets_dir:-NOT FOUND}"
          if [ -z "$assets_dir" ]; then
            echo "web UI assets not found" >&2
            exit 1
          fi
          cp -r "$assets_dir" dist/assets
          ls -R dist | head -n 50

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath "rostra-windows-x86_64-$env:BUILD_ID.zip" -Force
          # Assets alone, as a separate download (same files as dist/assets above)
          Compress-Archive -Path dist/assets -DestinationPath "rostra-assets-$env:BUILD_ID.zip" -Force
          Get-FileHash "rostra-windows-x86_64-$env:BUILD_ID.zip" -Algorithm SHA256
          Get-FileHash "rostra-assets-$env:BUILD_ID.zip" -Algorithm SHA256

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: "rostra-windows-x86_64"
          path: |
            rostra-windows-x86_64-*.zip
            rostra-assets-*.zip
          if-no-files-found: error

      - name: Release Windows package
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            rostra-windows-x86_64-*.zip
            rostra-assets-*.zip
          prerelease: ${{ contains(github.ref, 'rc') }}
          body: ${{ contains(github.ref, 'rc') && env.PRERELEASE_MESSAGE || '' }}
